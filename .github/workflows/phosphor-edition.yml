# RetroSpy, Phosphor edition: builds the Windows app (self-contained, with every skin) on each push, and
# publishes it as a release for a tag phosphor-<version> (e.g. phosphor-6.10.1), or a push to the branch
# release/phosphor-<version> (where tags can't be pushed: the release is tagged here, the branch removed).
# Phosphor's Windows release bundles that zip.
name: Phosphor edition (Windows)

on:
  push:
    branches: [master, "release/phosphor-*"]
    tags: ["phosphor-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build (win-x64, self-contained)
        run: |
          dotnet publish RetroSpyX/RetroSpyX.csproj -c Release -r win-x64 --self-contained true -nologo -o out/RetroSpy
          cp LICENSE out/RetroSpy/LICENSE.txt
          cp README.md out/RetroSpy/README.md
          # the version, for Phosphor for Windows (installs or updates RetroSpy\ only when it's older)
          sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' RetroSpyX/RetroSpyX.csproj | head -1 > out/RetroSpy/version.txt
          test -s out/RetroSpy/version.txt
          test -f out/RetroSpy/RetroSpy.exe && test -d out/RetroSpy/skins
          cd out && zip -qr ../RetroSpy-Phosphor-edition-win64.zip RetroSpy
      - uses: actions/upload-artifact@v4
        with:
          name: RetroSpy-Phosphor-edition-win64
          path: RetroSpy-Phosphor-edition-win64.zip
          retention-days: 3
      - name: Release (tags, release/phosphor-* branches)
        if: startsWith(github.ref, 'refs/tags/phosphor-') || startsWith(github.ref, 'refs/heads/release/phosphor-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          sha256sum RetroSpy-Phosphor-edition-win64.zip > SHA256SUMS.txt
          gh release create "$TAG" RetroSpy-Phosphor-edition-win64.zip SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "RetroSpy ${TAG#phosphor-} · Phosphor edition" \
            --notes "RetroSpy by zoggins and contributors (retro-spy.com), based on NintendoSpy by jaburns; skins by their authors. Phosphor edition by f3bandit: the SuperStation (Phosphor) source and Phosphor layout view, Phosphor's look. GPL-3.0. Unzip and run RetroSpy\\RetroSpy.exe, or install it from Phosphor for Windows (Settings > Controllers > RetroSpy). It keeps itself up to date (Help > Check for updates), and can sit in the tray and start with Windows."
      - name: Remove the release branch
        if: startsWith(github.ref, 'refs/heads/release/phosphor-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || true
